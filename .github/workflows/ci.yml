name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv sync --frozen
      # Leakage tests on synthetic data always run; the real-data and DB tests skip without data/raw and a DB.
      - run: uv run pytest -q
      # Demo page logic (escaping, link allow-list, waking notice, limits): Node's built-in test runner, no packages
      - run: node --test tests/js/*.test.mjs
      # The API image has no pandas: its tests must pass in an environment without it (runtime + dev groups, locked)
      - name: API tests without pandas
        env:
          UV_PROJECT_ENVIRONMENT: .venv-api
        run: |
          uv sync --frozen --no-default-groups --group dev
          uv run --no-sync python -c "import importlib.util as u, sys; sys.exit(u.find_spec('pandas') is not None)"
          uv run --no-sync pytest -q tests/test_api.py tests/test_health.py tests/test_limits.py tests/test_agent.py             tests/test_agent_db.py tests/test_runtime_image.py tests/test_page.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      # The API image (runtime dependencies only): no ignores.
      - run: uv export --frozen --format requirements-txt --no-emit-project --no-default-groups -o requirements-runtime.txt
      - run: uvx pip-audit -r requirements-runtime.txt --disable-pip --strict
      # Everything (local pipeline, training, dev tools). Ignored advisories have fixes younger than two weeks
      # (SECURITY.md, "Dependency exceptions"); none is in CISA's KEV list. The step fails once the ignores expire.
      - run: uv export --frozen --format requirements-txt --no-emit-project --all-groups -o requirements-audit.txt
      - name: Audit all groups (ignores expire 2026-11-02)
        env:
          IGNORE: >-
            PYSEC-2026-4320
            CVE-2026-112390 CVE-2026-112391 CVE-2026-112392 CVE-2026-112393 CVE-2026-112395 CVE-2026-112396
            CVE-2026-112397 CVE-2026-112399 CVE-2026-112400 CVE-2026-112401 CVE-2026-112402 CVE-2026-112404
            CVE-2026-112405 CVE-2026-112406 CVE-2026-112891 CVE-2026-112892 CVE-2026-112893 CVE-2026-112894
            CVE-2026-112895 CVE-2026-112896 CVE-2026-112897 CVE-2026-112899 CVE-2026-112900 CVE-2026-112901
            CVE-2026-113722 CVE-2026-113725
            CVE-2026-96636 CVE-2026-96637 CVE-2026-96638 CVE-2026-96639 CVE-2026-96640 CVE-2026-96641
            CVE-2026-96642 CVE-2026-96643 CVE-2026-96644 CVE-2026-96778 GHSA-78g4-xqwv-q3g8
            CVE-2026-114145
        run: |
          if [ "$(date -u +%F)" \> 2026-11-02 ]; then echo "pip-audit ignores expired: bump or review them"; exit 1; fi
          uvx pip-audit -r requirements-audit.txt --disable-pip --strict $(printf -- '--ignore-vuln %s ' $IGNORE)

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # gitleaks-action lists a PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # scan the full history, not just the last commit
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"  # report in the job log; no write access needed
