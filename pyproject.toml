[project]
name = "scout"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Runtime: what the API image installs (Dockerfile: --no-default-groups).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "anthropic>=1.11.0",
]

[dependency-groups]
# Pipeline, training, tracking and the local MCP server: installed locally and in CI, never in the API image.
local = [
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "mlflow>=3.16.1",
    "mcp==2.2.0",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pre-commit>=4.6.2",
]
# Fine-tuning experiment (docs/FINETUNE_PLAN.md): local Windows GPU only, never installed by default, in CI or the image.
finetune = [
    "torch==2.15.0 ; sys_platform == 'win32'",
    "transformers==5.22.2",
    "accelerate==1.15.0 ; sys_platform == 'win32'",  # requires torch
    "bitsandbytes==0.50.2 ; sys_platform == 'win32'",  # requires torch
    "safetensors==0.8.0",
    "tokenizers==0.23.3",
    "huggingface-hub==2.4.0",
]

[tool.uv]
default-groups = ["dev", "local"]
# TEMPORARY, two-week rule for transitive packages of the finetune group (newest release on or before 2026-11-10).
# Remove typer's cap after 2026-12-02 and regex's after 2026-12-07, when 0.29.2 and 2026.11.23 are 14 days old.
constraint-dependencies = ["regex<=2026.11.9", "typer<=0.29.0"]

# CUDA build of torch (PyPI's Windows wheel is CPU-only). Explicit: used for torch only, nothing else.
[[tool.uv.index]]
name = "pytorch-cu134"
url = "https://download.pytorch.org/whl/cu134"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu134" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
