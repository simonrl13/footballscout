[project]
name = "scout"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Runtime: what the API image installs (Dockerfile: --no-default-groups).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "anthropic>=1.11.0",
]

[dependency-groups]
# Pipeline, training, tracking and the local MCP server: installed locally and in CI, never in the API image.
local = [
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "mlflow>=3.16.1",
    "mcp==2.3.0",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pre-commit>=4.6.2",
]

[tool.uv]
default-groups = ["dev", "local"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
