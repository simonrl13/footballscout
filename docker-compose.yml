services:
  db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    # Only what Postgres and the db/init scripts need (role passwords are used on first init). Never the whole .env:
    # API keys and app tokens must not reach this container.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      SCOUT_LOADER_PASSWORD: ${SCOUT_LOADER_PASSWORD:?set in .env}
      SCOUT_READER_PASSWORD: ${SCOUT_READER_PASSWORD:?set in .env}
      SCOUT_MLFLOW_PASSWORD: ${SCOUT_MLFLOW_PASSWORD:?set in .env}
      SCOUT_TRACER_PASSWORD: ${SCOUT_TRACER_PASSWORD:?set in .env}
    ports: ["127.0.0.1:5432:5432"]  # never exposed beyond this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      # the API gets the read-only role for data and the trace-only role for agent traces
      READER_DATABASE_URL: postgresql://scout_reader:${SCOUT_READER_PASSWORD}@db:5432/${POSTGRES_DB}
      TRACER_DATABASE_URL: postgresql://scout_tracer:${SCOUT_TRACER_PASSWORD}@db:5432/${POSTGRES_DB}
      SCOUT_API_TOKEN: ${SCOUT_API_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
