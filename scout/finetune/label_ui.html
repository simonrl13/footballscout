<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scout labelling</title>
<style>
:root {
  --bg: #fafaf9; --panel: #ffffff; --fg: #1c1917; --muted: #57534e; --line: #e7e5e4;
  --accent: #1d4ed8; --accent-fg: #ffffff; --warn-bg: #fef2f2; --warn: #b91c1c; --ok: #15803d;
  --mark: #fef9c3; --name: #e0e7ff; --sel: #bfdbfe; --active: #eff6ff;
  --r: 6px; --gap: 12px; --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0a09; --panel: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c;
    --accent: #60a5fa; --accent-fg: #0c0a09; --warn-bg: #3b1212; --warn: #fca5a5; --ok: #86efac;
    --mark: #3f3a12; --name: #1e2a55; --sel: #1e3a8a; --active: #172036; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 2; display: flex; gap: var(--gap); align-items: center; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; }
.progress { flex: 1; min-width: 160px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress > div { height: 100%; background: var(--ok); width: 0; }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(320px, 2fr); gap: var(--gap); padding: var(--gap) 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.meta { color: var(--muted); font-size: 13px; margin: 0 0 10px; word-break: break-all; }
.meta a { color: var(--accent); }
#text { font: 14px/1.6 var(--mono); counter-reset: none; }
#text .ln { display: grid; grid-template-columns: 3.2em 1fr; }
#text .ln::before { content: attr(data-n); color: var(--muted); text-align: right; padding-right: .8em; user-select: none; }
#text .ln > span { white-space: pre-wrap; overflow-wrap: anywhere; }
#text mark.d { background: var(--mark); color: inherit; }
#text mark.n { background: var(--name); color: inherit; }
#text ::selection { background: var(--sel); }
.event { border: 1px solid var(--line); border-radius: var(--r); padding: 10px; margin-bottom: 10px; }
.event.active { border-color: var(--accent); background: var(--active); }
.event h3 { margin: 0 0 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
label.wide { grid-column: 1 / -1; }
input, select, textarea { font: inherit; font-size: 14px; color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 4px; padding: 6px 8px; min-height: 36px; width: 100%; }
textarea { resize: vertical; min-height: 36px; }
.evidence { font: 13px/1.4 var(--mono); padding: 6px 8px; border: 1px dashed var(--line); border-radius: 4px; min-height: 36px;
  white-space: pre-wrap; overflow-wrap: anywhere; }
.evidence.empty { color: var(--muted); font-family: inherit; }
.count { font-size: 12px; color: var(--muted); }
.count.over { color: var(--warn); font-weight: 600; }
button { font: inherit; font-size: 14px; min-height: 36px; padding: 6px 12px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.link { border: none; background: none; color: var(--warn); padding: 4px 6px; min-height: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.problems { background: var(--warn-bg); color: var(--warn); border-radius: var(--r); padding: 8px 12px; margin: 0 0 10px; font-size: 13px; }
.problems ul { margin: 4px 0 0; padding-left: 18px; }
.status { font-size: 13px; color: var(--muted); }
.none-badge { color: var(--ok); font-weight: 600; margin: 6px 0; }
kbd { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.help { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .progress > div { transition: width .2s ease-out; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Labelling</h1>
  <button id="prev" title="Previous (p)">← Prev</button>
  <span id="pos" class="status"></span>
  <button id="next" title="Next (n)">Next →</button>
  <div class="progress" role="progressbar" aria-label="Documents labelled" aria-valuemin="0" aria-valuenow="0" id="bar"><div></div></div>
  <span id="done" class="status"></span>
  <span id="saved" class="status" aria-live="polite"></span>
</header>
<main>
  <section aria-label="Document">
    <p class="meta" id="meta"></p>
    <div id="text"></div>
  </section>
  <section aria-label="Labels">
    <div id="problems"></div>
    <div id="events"></div>
    <div class="actions">
      <button id="add" class="primary">+ Add event</button>
      <button id="none" title="No events (0)">No events (none)</button>
    </div>
    <p class="help">Select text in the document to set the active event's evidence. Shortcuts outside fields:
      <kbd>n</kbd> next, <kbd>p</kbd> previous, <kbd>0</kbd> none, <kbd>a</kbd> add event, <kbd>Esc</kbd> leave a field.</p>
  </section>
</main>
<script>
"use strict";
const TYPES = ["injury", "contract_extension", "contract_expiry", "loan", "transfer"];
const FIELDS = ["type", "date", "contract_until", "injury_type", "duration_days", "evidence", "note"];
const MAX = 300;
const MONTHS = "January|February|March|April|May|June|July|August|September|October|November|December";
let docs = [], i = 0, rows = [], active = 0, timer = null;
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) k.startsWith("aria-") || k === "role" ? e.setAttribute(k, v) : (e[k] = v);
  e.append(...kids);
  return e;
};
const norm = (s) => s.replace(/\s+/g, " ").trim();
const blank = () => Object.fromEntries(FIELDS.map((f) => [f, ""]));
const isNone = () => rows.length === 1 && rows[0].type === "none";

async function api(method, path, body, keepalive = false) {  // keepalive: the request outlives the page (unload)
  const r = await fetch(path, { method, keepalive, headers: body ? { "Content-Type": "application/json" } : {}, body: body && JSON.stringify(body) });
  if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
  return r.json();
}

function highlight(line, nameRe) {  // marks dates and the player's name only; never proposes labels
  const re = new RegExp(`\\b(?:(?:${MONTHS})|(?:19|20)\\d{2}(?:[–-]\\d{2})?)\\b` + (nameRe ? `|${nameRe}` : ""), "g");
  const out = []; let last = 0, m;
  while ((m = re.exec(line))) {
    if (m.index > last) out.push(document.createTextNode(line.slice(last, m.index)));
    const isDate = new RegExp(`^(?:${MONTHS})$|^\\d{4}`).test(m[0]);
    out.push(el("mark", { className: isDate ? "d" : "n", textContent: m[0] }));
    last = m.index + m[0].length;
    if (m[0].length === 0) re.lastIndex++;
  }
  out.push(document.createTextNode(line.slice(last)));
  return out;
}

function renderDoc() {
  const d = docs[i];
  const names = (d.title || "").replace(/\s*\(.*\)$/, "").split(/\s+/).filter((w) => w.length > 2)
    .map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const nameRe = names.length ? `\\b(?:${names.join("|")})\\b` : "";
  $("title").textContent = d.title;
  $("pos").textContent = `${i + 1} / ${docs.length}`;
  $("meta").replaceChildren(`snapshot ${d.snapshot} · `, el("a", { href: d.url, target: "_blank", rel: "noopener noreferrer", textContent: "Wikipedia diff" }),
    ` · ${d.doc_id}`);
  $("text").replaceChildren(...d.text.split("\n").map((line, n) => el("div", { className: "ln" }, el("span", {}, ...highlight(line, nameRe)))));
  [...$("text").children].forEach((c, n) => c.dataset.n = n + 1);
  window.scrollTo({ top: 0 });
}

function field(r, f, label, extra = {}) {
  const input = el(f === "note" ? "textarea" : "input", { value: r[f], ...extra });
  input.addEventListener("input", () => { r[f] = input.value; queueSave(); });
  return el("label", { className: f === "note" ? "wide" : "" }, label, input);
}

function renderEvents() {
  const box = $("events");
  if (isNone()) { box.replaceChildren(el("p", { className: "none-badge", textContent: "Labelled: no events (none)." })); return; }
  box.replaceChildren(...rows.map((r, k) => {
    const sel = el("select", { "aria-label": "type" }, el("option", { value: "", textContent: "choose a type…" }),
      ...TYPES.map((t) => el("option", { value: t, textContent: t, selected: r.type === t })));
    sel.addEventListener("change", () => { r.type = sel.value; queueSave(); });
    const n = norm(r.evidence).length;
    const ev = el("div", { className: "evidence" + (r.evidence ? "" : " empty"), role: "status", "aria-live": "polite",
      "aria-label": `Evidence for event ${k + 1}`, textContent: r.evidence || "Select the exact words in the document." });
    const del = el("button", { className: "link", textContent: "Remove", "aria-label": `Remove event ${k + 1}` });
    del.addEventListener("click", (e) => { e.stopPropagation(); rows.splice(k, 1); active = Math.max(0, Math.min(active, rows.length - 1)); renderEvents(); queueSave(); });
    const card = el("div", { className: "event" + (k === active ? " active" : ""), role: "group",
      "aria-label": `Event ${k + 1}`, "aria-current": k === active ? "true" : "false" },
      el("h3", {}, `Event ${k + 1}${k === active ? " · active" : ""}`, del),
      el("div", { className: "grid" },
        el("label", {}, "type", sel), field(r, "date", "date (YYYY-MM-DD / YYYY-MM / YYYY)"),
        field(r, "contract_until", "contract_until"), field(r, "injury_type", "injury_type"),
        field(r, "duration_days", "duration_days", { inputMode: "numeric" }),
        el("label", { className: "wide" }, "evidence (from selection)", ev,
          el("span", { className: "count" + (n > MAX ? " over" : ""), textContent: `${n} / ${MAX} characters` })),
        field(r, "note", "note")));
    card.addEventListener("mousedown", () => { if (active !== k) { active = k; renderEvents(); } });
    return card;
  }));
}

function renderState(s) {
  const p = s.problems || [];
  $("problems").replaceChildren(...(p.length ? [el("div", { className: "problems", role: "alert" }, `${p.length} problem(s) in this document`,
    el("ul", {}, ...p.map((t) => el("li", { textContent: t }))))] : []));
  if (s.progress) renderProgress(s.progress);
}

function renderProgress(pr) {
  $("done").textContent = `${pr.done} / ${pr.total} labelled` + (pr.with_problems.length ? ` · ${pr.with_problems.length} with problems` : "");
  $("bar").firstElementChild.style.width = `${(100 * pr.done) / pr.total}%`;
  $("bar").setAttribute("aria-valuenow", pr.done); $("bar").setAttribute("aria-valuemax", pr.total);
  $("bar").setAttribute("aria-valuetext", `${pr.done} of ${pr.total} labelled`);
}

function queueSave() { clearTimeout(timer); $("saved").textContent = "editing…"; timer = setTimeout(save, 400); }
async function save() {
  clearTimeout(timer); timer = null;
  try { renderState(await api("PUT", `/api/doc/${i}`, { rows })); $("saved").textContent = "saved"; }
  catch (e) { $("saved").textContent = `NOT SAVED: ${e.message}`; }
}

async function go(k) {
  if (k < 0 || k >= docs.length) return;
  if (timer) await save();
  i = k; active = 0;
  const s = await api("GET", `/api/doc/${i}`);
  rows = s.rows.filter((r) => FIELDS.some((f) => r[f])).map((r) => ({ ...blank(), ...r }));
  if (!rows.length) rows = [blank()];
  renderDoc(); renderEvents(); renderState(s);
  try { history.replaceState(null, "", `#${i + 1}`); } catch (_) {}
}

function addEvent() { if (isNone()) rows = []; rows.push(blank()); active = rows.length - 1; renderEvents(); queueSave(); }
function setNone() {
  if (!isNone() && rows.some((r) => FIELDS.some((f) => r[f])) && !confirm("Replace this document's events with 'none'?")) return;
  rows = [{ ...blank(), type: "none" }]; active = 0; renderEvents(); save();
}

document.addEventListener("mouseup", () => {
  const s = window.getSelection();
  if (!s || s.isCollapsed || !$("text").contains(s.anchorNode) || !$("text").contains(s.focusNode) || isNone()) return;
  const t = s.toString().trim();
  if (!t || !rows[active]) return;
  rows[active].evidence = t; renderEvents(); queueSave();
});

document.addEventListener("keydown", (e) => {
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (e.key === "Escape" && typing) { document.activeElement.blur(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "n") go(i + 1);
  else if (e.key === "p") go(i - 1);
  else if (e.key === "0") setNone();
  else if (e.key === "a") { e.preventDefault(); addEvent(); }
});

$("prev").addEventListener("click", () => go(i - 1));
$("next").addEventListener("click", () => go(i + 1));
$("add").addEventListener("click", addEvent);
$("none").addEventListener("click", setNone);
window.addEventListener("pagehide", () => {  // a pending edit is sent even as the tab closes or reloads
  if (timer) { clearTimeout(timer); timer = null; api("PUT", `/api/doc/${i}`, { rows }, true).catch(() => {}); }
});

(async () => {
  const d = await api("GET", "/api/docs");
  docs = d.docs; document.title = `Scout labelling: ${d.split}`;
  renderProgress(d);
  const fromHash = parseInt(location.hash.slice(1), 10);
  go(Number.isInteger(fromHash) && fromHash >= 1 && fromHash <= docs.length ? fromHash - 1 : d.first_unlabelled);
})();
</script>
</body>
</html>
